<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Heart Assembly</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // --- НАСТРОЙКИ ---
            const PARTICLE_COUNT = 2000;       // Частиц в сердце
            const BG_PARTICLE_COUNT = 300;     // Частиц по краям
            const HEART_SCALE = 18;            // Размер сердца
            const ROTATION_SPEED = 0.005;      // Скорость вращения
            const ASSEMBLY_SPEED = 0.01;       // Скорость сбора
            // ------------------

            const particles = [];
            const bgParticles = [];

            // --- 1. ЧАСТИЦЫ ДЛЯ СЕРДЦА (ярко-розовые) ---
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                
                const x2d = 16 * Math.pow(Math.sin(t), 3);
                const y2d = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                
                const angle3d = Math.random() * Math.PI * 2;
                const radius = Math.random() * 1.5;
                
                particles.push({
                    x: (Math.random() - 0.5) * 600,
                    y: (Math.random() - 0.5) * 600,
                    z: (Math.random() - 0.5) * 300,
                    
                    tx: x2d + Math.cos(angle3d) * radius,
                    ty: y2d + Math.sin(angle3d) * radius,
                    tz: (Math.random() - 0.5) * 3,
                    
                    color: Math.random() > 0.5 ? "#ff00aa" : "#ff66cc",
                    size: Math.random() * 1.5 + 0.5,
                    offset: Math.random() * Math.PI * 2
                });
            }

            // --- 2. ФОНОВЫЕ ЧАСТИЦЫ ПО КРАЯМ (розовые) ---
            for (let i = 0; i < BG_PARTICLE_COUNT; i++) {
                let x, y;
                const side = Math.floor(Math.random() * 4);
                const margin = 200;

                if (side === 0) { // Верх
                    x = Math.random() * canvas.width;
                    y = Math.random() * margin;
                } else if (side === 1) { // Низ
                    x = Math.random() * canvas.width;
                    y = canvas.height - Math.random() * margin;
                } else if (side === 2) { // Лево
                    x = Math.random() * margin;
                    y = Math.random() * canvas.height;
                } else { // Право
                    x = canvas.width - Math.random() * margin;
                    y = Math.random() * canvas.height;
                }

                bgParticles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2.5 + 1,
                    color: Math.random() > 0.5 ? "#ff00aa" : "#ff33bb",
                    offset: Math.random() * Math.PI * 2
                });
            }

            let rotation = 0;

            function animate() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                rotation += ROTATION_SPEED;
                const time = Date.now() * 0.002;

                // --- РИСУЕМ ФОНОВЫЕ ЧАСТИЦЫ ---
                for (let p of bgParticles) {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    const flicker = 0.5 + 0.5 * Math.sin(time + p.offset);
                    
                    ctx.globalAlpha = 0.5 + 0.5 * flicker;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- РИСУЕМ СЕРДЦЕ ---
                for (let p of particles) {
                    p.x += (p.tx - p.x) * ASSEMBLY_SPEED;
                    p.y += (p.ty - p.y) * ASSEMBLY_SPEED;
                    p.z += (p.tz - p.z) * ASSEMBLY_SPEED;

                    const cos = Math.cos(rotation);
                    const sin = Math.sin(rotation);
                    
                    const x3d = p.x * cos - p.z * sin;
                    const z3d = p.x * sin + p.z * cos;
                    const y3d = p.y;
                    
                    const scale = HEART_SCALE * (1 + z3d * 0.05);
                    const screenX = cx + x3d * scale;
                    const screenY = cy - y3d * scale;
                    
                    const safeSize = Math.max(0.5, p.size * (1 + z3d * 0.02));
                    
                    const alpha = 0.3 + 0.7 * ((z3d + 3) / 6);
                    const flicker = 0.7 + 0.3 * Math.sin(time + p.offset);
                    
                    ctx.globalAlpha = Math.max(0, Math.min(1, alpha * flicker));
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, safeSize, 0, Math.PI * 2);
                    ctx.fill();
                }

                requestAnimationFrame(animate);
            }

            animate();
        };
    </script>
</body>
</html>
